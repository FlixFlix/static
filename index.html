<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Pickup 264</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #ffdd00;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    .wrap {
      min-height: 100vh;
      min-height: 100dvh;
      box-sizing: border-box;
      padding: 2vh 2vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .name {
      flex: 0 0 auto;
      font-size: clamp(1.25rem, 5vw, 4rem);
      line-height: 1.1;
      white-space: nowrap;
    }
    #fit {
      flex: 0 1 auto;
      width: 100%;
      white-space: nowrap;
      font-weight: 800;
      line-height: 1;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <main class="wrap">
    <div class="name">Zach &amp; Jacob <strong>STANEK</strong></div>
    <div id="fit">264</div>
  </main>

  <script>
    const wrap = document.querySelector('.wrap');
    const name = document.querySelector('.name');
    const number = document.getElementById('fit');

    function fitText() {
      const styles = getComputedStyle(wrap);
      const verticalPadding = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
      const availableWidth = wrap.clientWidth;
      const availableHeight = wrap.clientHeight - verticalPadding - name.offsetHeight;

      let lo = 1;
      let hi = 4000;
      while (lo < hi) {
        const mid = Math.ceil((lo + hi) / 2);
        number.style.fontSize = mid + 'px';
        if (number.scrollWidth <= availableWidth && number.scrollHeight <= availableHeight) {
          lo = mid;
        } else {
          hi = mid - 1;
        }
      }
      number.style.fontSize = lo + 'px';
    }

    addEventListener('resize', fitText);
    addEventListener('orientationchange', fitText);
    new ResizeObserver(fitText).observe(wrap);
    fitText();
  </script>
</body>
</html>
